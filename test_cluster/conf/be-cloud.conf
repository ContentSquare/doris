# Apache Doris BE Cloud Mode Configuration

# Basic settings
priority_networks = 172.20.90.0/24
heartbeat_service_port = 9050
be_port = 9060
webserver_port = 8040
brpc_port = 8060

# Cloud mode specific settings
cloud_mode = true
meta_service_endpoint = http://meta-service:5000

# Object storage settings
cloud_default_cluster_id = test_cluster
cloud_sql_server_cluster_id = test_cluster
cloud_sql_server_cluster_name = test_cluster

# S3 storage settings
s3_endpoint = http://minio:9000
s3_region = us-east-1
s3_access_key = doris-admin
s3_secret_key = doris-password-123
use_path_style = true

# Storage settings (minimal for cloud mode)
storage_root_path = /opt/apache-doris/be/storage
file_cache_path = [{"path": "/opt/apache-doris/be/storage/filecache", "total_size": 10737418240, "query_limit": 1073741824}]

# Memory settings
mem_limit = 80%
write_buffer_size = 104857600

# Performance settings  
disable_auto_compaction = false
max_tablet_version_num = 1000
default_num_rows_per_column_file_block = 1024

# Logging
sys_log_level = INFO
sys_log_roll_mode = SIZE-MB-1024
sys_log_roll_num = 10

# Enable vectorized engine
enable_vectorized_engine = true
batch_size = 4096

# Cache settings
block_cache_size = 2147483648
index_page_cache_size = 10737418240

# Compression
compress_rowbatches = true
rpc_compress_ratio_threshold = 1.1