# Apache Doris FE Cloud Mode Configuration

# Basic settings
priority_networks = 172.20.90.0/24
frontend_address = 172.20.90.10

# Query engine
qe_max_connection = 1024
max_connection = 4096

# Cloud mode specific settings
cloud_mode = true
meta_service_endpoint = http://meta-service:5000

# Object storage settings
cloud_default_cluster_id = test_cluster
cloud_sql_server_cluster_id = test_cluster
cloud_sql_server_cluster_name = test_cluster

# S3 storage settings  
s3_endpoint = http://minio:9000
s3_region = us-east-1
s3_access_key = doris-admin
s3_secret_key = doris-password-123
use_path_style = true

# Logging
sys_log_level = INFO
sys_log_roll_mode = SIZE-MB-1024
sys_log_roll_num = 10
audit_log_roll_mode = SIZE-MB-1024
audit_log_roll_num = 10

# Performance settings
parallel_fragment_exec_instance_num = 1
max_backend_down_time_second = 60
tablet_create_timeout_second = 30

# Enable statistics
enable_stats = true
enable_new_load_on_publish = true